<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Neon Drift</title>
    <meta
      name="description"
      content="Neon Drift is a fast-paced arcade survival game where you fight off waves of shadow drones and gather energy shards."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23050b18'/%3E%3Cpath d='M32 8l6 16 16 6-16 6-6 16-6-16-16-6 16-6 6-16z' fill='%237ae7ff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hud" aria-live="polite">
        <div class="stat">
          <span class="label">Energy / 220</span>
          <strong id="scoreValue">0</strong>
        </div>
        <div class="stat">
          <span class="label">Wave</span>
          <strong id="waveValue">1</strong>
        </div>
        <div class="stat health-wrap">
          <span class="label">Hull</span>
          <div class="health-bar">
            <div id="healthFill" class="health-fill"></div>
          </div>
        </div>
      </header>

      <main class="arena-wrap">
        <canvas id="gameCanvas" width="960" height="540" aria-label="Neon Drift game area"></canvas>

        <div id="overlay" class="overlay visible" role="dialog" aria-modal="false">
          <div class="panel">
            <p class="eyebrow">Arcade Survival</p>
            <h1 id="overlayTitle">Neon Drift</h1>
            <p id="overlayText">
              Pilot a starfighter through a swarm of hostile drones. Collect 220 energy from glowing shards to escape.
            </p>
            <button id="startButton" type="button">Start Run</button>
          </div>
        </div>
      </main>

      <div class="touch-controls" aria-label="Touch controls">
        <div class="dpad" aria-label="Movement Controls">
          <button class="dpad-btn up" data-dir="up" type="button" aria-label="Move up">▲</button>
          <button class="dpad-btn left" data-dir="left" type="button" aria-label="Move left">◀</button>
          <button class="dpad-btn down" data-dir="down" type="button" aria-label="Move down">▼</button>
          <button class="dpad-btn right" data-dir="right" type="button" aria-label="Move right">▶</button>
        </div>
        <button id="fireButton" class="fire-button" type="button" aria-label="Fire weapon">FIRE</button>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
