<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mushroom Run</title>
    <meta
      name="description"
      content="Mushroom Run is a Mario-inspired browser platformer where you collect coins and dash to the flag."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230d1120'/%3E%3Ccircle cx='32' cy='32' r='20' fill='%23f5c76e'/%3E%3Cpath d='M22 24h20v12H22z' fill='%2377d36d'/%3E%3Cpath d='M20 40h24v8H20z' fill='%2353a7ff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hud" aria-live="polite">
        <div class="stat">
          <span class="label">Coins</span>
          <strong id="scoreValue">0</strong>
        </div>
        <div class="stat">
          <span class="label">World</span>
          <strong id="waveValue">1-1</strong>
        </div>
        <div class="stat health-wrap">
          <span class="label">Lives</span>
          <div class="health-bar" aria-label="Player lives">
            <div id="healthFill" class="health-fill"></div>
          </div>
        </div>
      </header>

      <main class="arena-wrap">
        <canvas id="gameCanvas" width="960" height="540" aria-label="Mushroom Run game area"></canvas>

        <div id="overlay" class="overlay visible" role="dialog" aria-modal="false">
          <div class="panel">
            <p class="eyebrow">Platformer</p>
            <h1 id="overlayTitle">Mushroom Run</h1>
            <p id="overlayText">
              Collect 12 coins, stomp the roaming critters, and reach the flag. Move with ← → or A / D, duck with ↓ or S, and jump with Space or ↑. Your checkpoint saves your progress through the valley.
            </p>
            <button id="startButton" type="button">Start Run</button>
          </div>
        </div>
      </main>

      <div class="touch-controls" aria-label="Touch controls">
        <div class="dpad" aria-label="Movement Controls">
          <button class="dpad-btn up" data-dir="up" type="button" aria-label="Jump">▲</button>
          <button class="dpad-btn left" data-dir="left" type="button" aria-label="Move left">◀</button>
          <button class="dpad-btn right" data-dir="right" type="button" aria-label="Move right">▶</button>
          <button class="dpad-btn down" data-dir="down" type="button" aria-label="Duck">▼</button>
        </div>
        <button id="fireButton" class="fire-button" type="button" aria-label="Jump">JUMP</button>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
